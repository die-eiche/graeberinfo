  <link rel="apple-touch-icon" sizes="180x180" href="logo.png?v=2026-07-20-eichellaub">

</head>
<body>
  <main>
    <header>
      <img class="logo" src="logo.png?v=2026-07-20-eichellaub" alt="Ehrenamt Logo">
      <div class="header-text">
        <h1 id="title-button" type="button">Wer hat Dienst?</h1>
        <p>Nächste 10 Tage ab heute</p>
      </div>
    </header>

    <aside id="feature-hint" class="feature-hint" hidden>
      <p>Doppel-Tippen auf einen Tag: Geburtstage und Todestage. Lange auf den heutigen Tag drücken: Besucher eintragen (Angehörige, Interessierte oder Grabverkauf).</p>
      <button type="button" id="feature-hint-dismiss">Verstanden</button>
    </aside>

    <div id="content"></div>
  </main>

  <dialog id="name-dialog" class="name-dialog">
    <form id="name-form" method="dialog">
      <label for="viewer-name">Dein Name (wie in der Liste)</label>
      <input id="viewer-name" type="text" placeholder="z. B. Morenz, Peggy" autocomplete="name" spellcheck="false">
      <button type="submit">Speichern</button>
    </form>
  </dialog>

  <dialog id="memorial-dialog" class="memorial-dialog">
    <div class="memorial-panel">
      <h2 id="memorial-title">Gedenken</h2>
      <div id="memorial-body"></div>
      <button type="button" id="memorial-close">Schließen</button>
    </div>
  </dialog>

  <dialog id="visitor-dialog" class="visitor-dialog">
    <form id="visitor-form">
      <h2 id="visitor-title">Besucher eintragen</h2>
      <p id="visitor-date" class="visitor-date"></p>
      <fieldset class="visitor-types">
        <legend>Art der Besucher</legend>
        <label>
          <input type="radio" name="visitor-type" value="hinterbliebene" required>
          Angehörige
        </label>
        <label>
          <input type="radio" name="visitor-type" value="hausfuehrung">
          Interessierte
        </label>
        <label>
          <input type="radio" name="visitor-type" value="grabverkauf">
          Grabverkauf
        </label>
      </fieldset>
      <p id="visitor-status" class="visitor-status"></p>
      <div class="visitor-actions">
        <button type="button" id="visitor-cancel">Abbrechen</button>
        <button type="submit" id="visitor-save">Bestätigen</button>
      </div>
    </form>
  </dialog>

  <script src="app.js?v=2026-09-21-angehoerige"></script>
